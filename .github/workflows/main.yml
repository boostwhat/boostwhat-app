name: Build Boostwhat APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.2'

    - name: Download & Extract Source Code
      run: |
        curl -sLO https://boostwhat.web.id/Boostwhat_Android_App_Source.zip
        unzip -o Boostwhat_Android_App_Source.zip

    - name: Compile APK
      run: |
        gradle assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Boostwhat-App-Debug-APK
        path: "**/outputs/apk/debug/*.apk"
